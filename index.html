<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="container">
        <h1>Wordle</h1>
        <div class="subtitle">Guess the 5-letter word!</div>
        <div id="board"></div>     

        <div id="message"></div>

        <div id="keyboard"></div>

        <div class="controls">
            <button id="newGameBtn" class="b1">New Game</button>
            <button id="giveUpBtn" class="secondary">Give Up</button>
        </div>

    </div>
</body>
</html>
